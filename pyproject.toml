[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "milkyway-payments"
version = "0.0.0"
description = "Official Python client for the MilkyWay Payments API (/payments/v1)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Planet9" }]
keywords = ["milkyway", "payments", "planet9", "settlement", "fintech"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.25",
    "urllib3>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "responses>=0.23",
]

[project.urls]
Homepage = "https://github.com/bankplanet9/milkyway-python-sdk"
Repository = "https://github.com/bankplanet9/milkyway-python-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/milkyway_payments"]

[tool.hatch.build.targets.sdist]
include = ["src/milkyway_payments", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
