name: Publish to PyPI

# Triggered when semantic-release (in ci.yml) publishes a GitHub release.
# Builds the dist for the released tag and uploads it to PyPI via Trusted
# Publishing (OIDC — no long-lived token). Guarded on the PUBLISH_ENABLED repo
# variable so it is a no-op until the PyPI trusted-publisher policy exists.
on:
  release:
    types: [published]

jobs:
  publish:
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # mint the OIDC token PyPI exchanges for an upload credential
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distribution
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
