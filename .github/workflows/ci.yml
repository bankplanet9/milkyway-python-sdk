name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Test
        run: python -m pytest -q

  release:
    # Auto-version on every push to main. semantic-release computes the next
    # version, builds the dist, and cuts a GitHub release + tag. It then explicitly
    # dispatches publish.yml for the new tag — a release created with GITHUB_TOKEN
    # does NOT fire the `release: published` event, so we trigger the PyPI upload
    # ourselves. No releasable commits (chore/docs/ci only) → no release.
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create git tags + GitHub releases
      issues: write         # semantic-release comments on resolved issues/PRs
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # semantic-release needs full history + tags

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Semantic release
        run: npx --yes -p semantic-release -p @semantic-release/exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger PyPI publish for the new release
        # prepareCmd builds dist/ only when a release happened, so this is our
        # "did we release?" signal. publish.yml does the OIDC upload to PyPI.
        if: hashFiles('dist/*.whl') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --repo "${{ github.repository }}" -f tag="$(git describe --tags --abbrev=0)"
