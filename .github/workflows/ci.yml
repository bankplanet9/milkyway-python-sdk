name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Test
        run: python -m pytest -q

  release:
    # Auto-version on every push to main. semantic-release analyses the
    # conventional commits, computes the next version, writes it into the package,
    # builds the dist, and cuts a GitHub release + tag (which publish.yml then
    # uploads to PyPI). No releasable commits (chore/docs/ci only) → no release.
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create git tags + GitHub releases
      issues: write         # semantic-release comments on resolved issues/PRs
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # semantic-release needs full history + tags

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Semantic release
        run: npx --yes -p semantic-release -p @semantic-release/exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
